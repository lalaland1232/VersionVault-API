services:
  app:
    image: versionvault
    ports :
      - "8000:8000"
    depends_on:
       db:
          condition: service_healthy
    env_file:
      - .env
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: shiv
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: project_phase2
    volumes:
      - postgre_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U shiv -d project_phase2"]
      interval: 5s
      timeout: 1m
      retries: 5
  
  redis:
    image: redis:latest


volumes : 
  postgre_data: